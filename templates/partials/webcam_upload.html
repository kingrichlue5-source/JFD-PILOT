{% load static %}
<!-- Webcam Capture + Document Upload Component -->
<!-- Usage: {% include "partials/webcam_upload.html" with input_name="documents" photo_input_name="photo" %} -->

{% with input_name=input_name|default:"documents" photo_input_name=photo_input_name|default:"photo" %}
<div class="space-y-4">
    <!-- Webcam Capture -->
    <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">
            <svg class="w-4 h-4 inline text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Photo Capture
        </label>
        <div class="flex items-center gap-3">
            <button type="button" onclick="openWebcamModal('{{ photo_input_name }}')" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-all shadow-md shadow-blue-500/20 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Open Camera
            </button>
            <span id="webcam-status-{{ photo_input_name }}" class="text-xs text-slate-400"></span>
        </div>
        <div id="webcam-preview-{{ photo_input_name }}" class="mt-2 hidden">
            <div class="relative inline-block">
                <img id="webcam-captured-{{ photo_input_name }}" class="w-32 h-32 object-cover rounded-xl border-2 border-slate-200" alt="Captured photo">
                <button type="button" onclick="clearWebcamCapture('{{ photo_input_name }}')" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center text-xs hover:bg-red-600">&times;</button>
            </div>
        </div>
    </div>

    <!-- Document Upload -->
    <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">
            <svg class="w-4 h-4 inline text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Documents (any type: PDF, DOCX, images, etc.)
        </label>
        <div id="drop-zone-{{ input_name }}" class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-blue-400 transition-all cursor-pointer" onclick="document.getElementById('file-input-{{ input_name }}').click()">
            <svg class="w-8 h-8 mx-auto text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p class="text-xs text-slate-500">Drag & drop files here or <span class="text-blue-600 font-bold">browse</span></p>
            <p class="text-[10px] text-slate-400 mt-1">PDF, DOCX, XLSX, JPG, PNG — Max 10MB each</p>
        </div>
        <input type="file" id="file-input-{{ input_name }}" name="{{ input_name }}" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.gif,.bmp,.tiff,.txt,.csv" class="hidden" onchange="handleFileSelect(event, '{{ input_name }}')">
        <div id="file-list-{{ input_name }}" class="mt-3 space-y-2"></div>
    </div>
</div>

<!-- Webcam Modal -->
<div id="webcam-modal-{{ photo_input_name }}" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="text-sm font-bold text-slate-900">Capture Photo</h3>
            <button type="button" onclick="closeWebcamModal('{{ photo_input_name }}')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-4">
            <video id="webcam-video-{{ photo_input_name }}" class="w-full rounded-xl bg-black" autoplay playsinline></video>
            <canvas id="webcam-canvas-{{ photo_input_name }}" class="hidden"></canvas>
        </div>
        <div class="p-4 border-t border-slate-100 flex justify-center">
            <button type="button" id="capture-btn-{{ photo_input_name }}" onclick="capturePhoto('{{ photo_input_name }}')" class="px-6 py-3 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-all shadow-md shadow-blue-500/20 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Capture
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    const webcamStreams = {};
    const fileStore = {};

    window.openWebcamModal = function(inputName) {
        const modal = document.getElementById('webcam-modal-' + inputName);
        const video = document.getElementById('webcam-video-' + inputName);
        modal.classList.remove('hidden');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
            .then(function(stream) {
                webcamStreams[inputName] = stream;
                video.srcObject = stream;
                document.getElementById('webcam-status-' + inputName).textContent = 'Camera active';
            })
            .catch(function(err) {
                console.error('Webcam error:', err);
                document.getElementById('webcam-status-' + inputName).textContent = 'Camera not available';
                modal.classList.add('hidden');
                alert('Could not access camera. Please check permissions or use file upload instead.');
            });
    };

    window.closeWebcamModal = function(inputName) {
        const modal = document.getElementById('webcam-modal-' + inputName);
        const video = document.getElementById('webcam-video-' + inputName);
        if (webcamStreams[inputName]) {
            webcamStreams[inputName].getTracks().forEach(function(t) { t.stop(); });
            delete webcamStreams[inputName];
        }
        video.srcObject = null;
        modal.classList.add('hidden');
    };

    window.capturePhoto = function(inputName) {
        const video = document.getElementById('webcam-video-' + inputName);
        const canvas = document.getElementById('webcam-canvas-' + inputName);
        const preview = document.getElementById('webcam-preview-' + inputName);
        const img = document.getElementById('webcam-captured-' + inputName);

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

        img.src = dataUrl;
        preview.classList.remove('hidden');

        canvas.toBlob(function(blob) {
            const file = new File([blob], 'webcam_' + Date.now() + '.jpg', { type: 'image/jpeg' });
            const dt = new DataTransfer();
            dt.items.add(file);
            const existingInput = document.querySelector('input[name="' + inputName + '"][type="file"]');
            if (existingInput) {
                existingInput.files = dt.files;
            } else {
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'file';
                hiddenInput.name = inputName;
                hiddenInput.files = dt.files;
                hiddenInput.style.display = 'none';
                document.forms[0].appendChild(hiddenInput);
            }
        }, 'image/jpeg', 0.9);

        closeWebcamModal(inputName);
        document.getElementById('webcam-status-' + inputName).textContent = 'Photo captured';
    };

    window.clearWebcamCapture = function(inputName) {
        document.getElementById('webcam-preview-' + inputName).classList.add('hidden');
        document.getElementById('webcam-status-' + inputName).textContent = '';
        const fileInput = document.querySelector('input[name="' + inputName + '"][type="file"]');
        if (fileInput) fileInput.value = '';
    };

    window.handleFileSelect = function(event, inputName) {
        const files = event.target.files;
        const listEl = document.getElementById('file-list-' + inputName);
        if (!fileStore[inputName]) fileStore[inputName] = [];

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.size > 10 * 1024 * 1024) {
                alert(file.name + ' exceeds 10MB limit');
                continue;
            }
            fileStore[inputName].push(file);
        }

        renderFileList(inputName);
        event.target.value = '';
    };

    function renderFileList(inputName) {
        const listEl = document.getElementById('file-list-' + inputName);
        const files = fileStore[inputName] || [];
        listEl.innerHTML = '';

        files.forEach(function(file, idx) {
            const ext = file.name.split('.').pop().toLowerCase();
            const isImage = ['jpg','jpeg','png','gif','bmp'].indexOf(ext) !== -1;
            const icon = isImage
                ? '<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>'
                : '<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>';
            const size = file.size < 1024 ? file.size + ' B' : file.size < 1048576 ? (file.size / 1024).toFixed(1) + ' KB' : (file.size / 1048576).toFixed(1) + ' MB';

            const div = document.createElement('div');
            div.className = 'flex items-center gap-3 p-2 bg-slate-50 rounded-xl';
            div.innerHTML = icon
                + '<div class="flex-1 min-w-0"><p class="text-xs font-semibold text-slate-700 truncate">' + file.name + '</p><p class="text-[10px] text-slate-400">' + size + '</p></div>'
                + '<button type="button" onclick="removeFile(\'' + inputName + '\', ' + idx + ')" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-red-100 text-red-400 hover:text-red-600"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>';
            listEl.appendChild(div);
        });
    }

    window.removeFile = function(inputName, idx) {
        fileStore[inputName].splice(idx, 1);
        renderFileList(inputName);
    };

    document.addEventListener('DOMContentLoaded', function() {
        ['drop-zone-documents'].forEach(function(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const inputName = id.replace('drop-zone-', '');
            el.addEventListener('dragover', function(e) { e.preventDefault(); el.classList.add('border-blue-400', 'bg-blue-50'); });
            el.addEventListener('dragleave', function(e) { e.preventDefault(); el.classList.remove('border-blue-400', 'bg-blue-50'); });
            el.addEventListener('drop', function(e) {
                e.preventDefault();
                el.classList.remove('border-blue-400', 'bg-blue-50');
                const fakeEvent = { target: { files: e.dataTransfer.files, value: '' } };
                handleFileSelect(fakeEvent, inputName);
            });
        });
    });
})();
</script>
{% endwith %}
